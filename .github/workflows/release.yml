name: Release

# The Terraform Registry watches for semver tags and pulls the release assets
# GoReleaser produces, so tagging is the whole publish action.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Releases are signed unless the repository opts out explicitly by
      # setting the variable RELEASE_UNSIGNED to "true" (a fork with no signing
      # key). The OpenTofu Registry accepts unsigned releases while it holds no
      # key for the provider; the Terraform Registry does not. Without the
      # opt-out a missing GPG_PRIVATE_KEY fails the import step, as it always
      # did, rather than quietly publishing an unsigned release.
      SIGNED: ${{ vars.RELEASE_UNSIGNED != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Imports the signing key and starts an agent, so GoReleaser can sign
      # non-interactively.
      - id: import_gpg
        if: env.SIGNED == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ env.SIGNED != 'true' && '--skip=sign' || '' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# The Terraform Registry watches for semver tags and pulls the release assets
# GoReleaser produces, so tagging is the whole publish action.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # A repository without the signing secret (a fork) releases unsigned. The
      # OpenTofu Registry accepts that while it holds no key for the provider;
      # the Terraform Registry does not.
      SIGNED: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Imports the signing key and starts an agent, so GoReleaser can sign
      # non-interactively.
      - id: import_gpg
        if: env.SIGNED == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ env.SIGNED != 'true' && '--skip=sign' || '' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

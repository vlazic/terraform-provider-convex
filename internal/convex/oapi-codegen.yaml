# Consumed by the go:generate directives in generate.go, which run with this
# directory as the working directory -- all paths below are relative to it.
package: convex
output: client.gen.go
generate:
  models: true
  client: true
output-options:
  skip-prune: true
  # Several schema components in the Convex spec are themselves named
  # "<Something>Response" and collide with the per-operation response wrappers
  # oapi-codegen generates. Suffixing the wrappers keeps both sets distinct.
  response-type-suffix: HTTPResponse
